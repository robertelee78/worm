<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" data-archetype="journey">
  <title id="title">Runtime flow from a genuine turn to an earned intercept</title>
  <desc id="desc">The player approaches a fork, Worm scores the forecast already committed for this frame, filters forced moves, updates the evidence ledger, chooses a move with survival intact, and persists the read. The same left-turn fork closes with a coral intercept only after proof.</desc>
  <style>.bg{fill:#fffdf4}.ink{fill:#132a2e}.muted{fill:#567075}.card{fill:#e8e1c8;stroke:#b8ad8e;stroke-width:3}.dark{fill:#132a2e}.cyan{fill:#54d3c9}.coral{fill:#ef6a4b}.acid{fill:#d5e83f}.label{font:650 27px 'Space Grotesk',sans-serif}.body{font:500 20px 'IBM Plex Sans',sans-serif}.mono{font:600 17px 'IBM Plex Mono',monospace;letter-spacing:.04em}.path{fill:none;stroke:#567075;stroke-width:6;stroke-linecap:round}.stage{animation:stage 9s infinite}.final{animation:final 9s infinite}@keyframes stage{0%,15%{opacity:.78}30%,100%{opacity:1}}@keyframes final{0%,67%{transform:translateX(18px);opacity:.72}82%,100%{transform:none;opacity:1}}@media(prefers-reduced-motion:reduce){.stage,.final{animation:none}}</style>
  <rect class="bg" width="1200" height="650" rx="28" stroke="#b8ad8e" stroke-width="3"/>
  <text class="mono muted" x="48" y="55">one frame is scored before the next move is chosen</text>
  <path class="path" d="M130 308H1070"/><path d="M1054 294l18 14-18 14" fill="none" stroke="#567075" stroke-width="6"/>
  <g><rect class="card" x="44" y="118" width="190" height="380" rx="22"/><text class="mono muted" x="72" y="155">the fork</text><path d="M82 418h58V304h55m-55 0v-92" fill="none" stroke="#54d3c9" stroke-width="14" stroke-linecap="round"/><circle class="cyan" cx="140" cy="304" r="14"/><text class="label ink" x="72" y="458">you break left</text><text class="body ink" x="72" y="486">with straight still legal</text></g>
  <g class="stage"><rect class="dark" x="264" y="190" width="184" height="235" rx="22"/><text class="mono" x="291" y="228" fill="#8fb0b0">score first</text><rect x="291" y="258" width="130" height="76" rx="12" fill="#f4f0df"/><text class="body ink" x="307" y="288">forecast</text><text class="label ink" x="307" y="321">left ↰</text><text class="body" x="291" y="374" fill="#fffdf4">committed before</text><text class="body" x="291" y="402" fill="#fffdf4">your input</text></g>
  <g class="stage"><rect class="card" x="478" y="190" width="184" height="235" rx="22"/><text class="mono muted" x="501" y="228">filter</text><text class="label ink" x="501" y="278">real choice?</text><path d="M516 313h108" stroke="#54d3c9" stroke-width="9"/><path d="M516 350h108" stroke="#b8ad8e" stroke-width="9" opacity=".4"/><text class="body ink" x="501" y="394">forced frames</text><text class="body ink" x="501" y="419">carry no shortcut</text></g>
  <g class="stage"><rect class="dark" x="692" y="190" width="184" height="235" rx="22"/><text class="mono" x="717" y="228" fill="#8fb0b0">evidence</text><path d="M720 355l38-42 34 20 49-78" fill="none" stroke="#d5e83f" stroke-width="8" stroke-linecap="round"/><text class="body" x="717" y="389" fill="#fffdf4">beat your own</text><text class="body" x="717" y="416" fill="#fffdf4">baseline over time</text></g>
  <g class="stage"><rect class="card" x="906" y="118" width="250" height="380" rx="22"/><text class="mono muted" x="934" y="155">choose and persist</text><text class="label ink" x="934" y="202">survival stays</text><text class="body ink" x="934" y="237">legal move floor unchanged</text><rect class="acid" x="934" y="270" width="194" height="54" rx="13"/><text class="body ink" x="962" y="305">earned read saved</text><g class="final"><path d="M965 438h122v-77h-62" fill="none" stroke="#54d3c9" stroke-width="14" stroke-linecap="round"/><path d="M1087 390h-84" stroke="#ef6a4b" stroke-width="14" stroke-linecap="round"/><rect class="coral" x="1016" y="374" width="20" height="52" rx="5"/></g><text class="label ink" x="934" y="468">left gate closes</text></g>
  <text class="mono muted" x="417" y="574">the opening fork returns here: prediction → proof → intercept</text>
</svg>
