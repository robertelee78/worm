<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc" data-archetype="field">
  <title id="title">Most frames are easy; only genuine choices carry the read</title>
  <desc id="desc">A field of routine straight frames fades away. A small set of voluntary turns remains, and an even smaller set where Worm beat the player's own baseline becomes evidence.</desc>
  <style>.bg{fill:#fffdf4}.ink{fill:#132a2e}.muted{fill:#7b8d8e}.routine{fill:#e4dcc0}.choice{fill:#54d3c9}.proof{fill:#d5e83f;stroke:#132a2e;stroke-width:3}.label{font:650 30px 'Space Grotesk',sans-serif}.body{font:500 22px 'IBM Plex Sans',sans-serif}.mono{font:600 18px 'IBM Plex Mono',monospace;letter-spacing:.05em}.fade{animation:fade 7s infinite}.survive{animation:survive 7s infinite}@keyframes fade{0%,20%{opacity:1}50%,100%{opacity:.16}}@keyframes survive{0%,45%{transform:scale(.84);opacity:.45}62%,100%{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.fade{opacity:.16}.survive{animation:none}}</style>
  <rect class="bg" width="1000" height="650" rx="28" stroke="#b8ad8e" stroke-width="3"/>
  <text class="mono muted" x="56" y="58">subtract the easy answers</text><text class="label ink" x="56" y="108">A high score is not yet a read.</text>
  <g class="fade">
    <g class="routine">
      <circle cx="92" cy="178" r="15"/><circle cx="142" cy="178" r="15"/><circle cx="192" cy="178" r="15"/><circle cx="242" cy="178" r="15"/><circle cx="292" cy="178" r="15"/><circle cx="342" cy="178" r="15"/><circle cx="392" cy="178" r="15"/><circle cx="442" cy="178" r="15"/><circle cx="492" cy="178" r="15"/><circle cx="542" cy="178" r="15"/><circle cx="592" cy="178" r="15"/><circle cx="642" cy="178" r="15"/><circle cx="692" cy="178" r="15"/><circle cx="742" cy="178" r="15"/><circle cx="792" cy="178" r="15"/><circle cx="842" cy="178" r="15"/><circle cx="892" cy="178" r="15"/>
      <circle cx="92" cy="228" r="15"/><circle cx="142" cy="228" r="15"/><circle cx="192" cy="228" r="15"/><circle cx="242" cy="228" r="15"/><circle cx="292" cy="228" r="15"/><circle cx="342" cy="228" r="15"/><circle cx="392" cy="228" r="15"/><circle cx="442" cy="228" r="15"/><circle cx="492" cy="228" r="15"/><circle cx="542" cy="228" r="15"/><circle cx="592" cy="228" r="15"/><circle cx="642" cy="228" r="15"/><circle cx="692" cy="228" r="15"/><circle cx="742" cy="228" r="15"/><circle cx="792" cy="228" r="15"/><circle cx="842" cy="228" r="15"/><circle cx="892" cy="228" r="15"/>
      <circle cx="92" cy="278" r="15"/><circle cx="142" cy="278" r="15"/><circle cx="192" cy="278" r="15"/><circle cx="242" cy="278" r="15"/><circle cx="292" cy="278" r="15"/><circle cx="342" cy="278" r="15"/><circle cx="392" cy="278" r="15"/><circle cx="442" cy="278" r="15"/><circle cx="492" cy="278" r="15"/><circle cx="542" cy="278" r="15"/><circle cx="592" cy="278" r="15"/><circle cx="642" cy="278" r="15"/><circle cx="692" cy="278" r="15"/><circle cx="742" cy="278" r="15"/><circle cx="792" cy="278" r="15"/><circle cx="842" cy="278" r="15"/><circle cx="892" cy="278" r="15"/>
    </g>
  </g>
  <g><circle class="choice" cx="242" cy="228" r="18"/><circle class="choice" cx="492" cy="178" r="18"/><circle class="choice" cx="642" cy="278" r="18"/><circle class="choice" cx="842" cy="228" r="18"/></g>
  <text class="body ink" x="58" y="348">routine frame</text><circle class="routine" cx="226" cy="341" r="13"/><text class="body ink" x="310" y="348">genuine choice</text><circle class="choice" cx="482" cy="341" r="13"/>
  <path d="M500 380v54" stroke="#b8ad8e" stroke-width="5"/><path d="M487 422l13 14 13-14" fill="none" stroke="#567075" stroke-width="5"/>
  <g class="survive" style="transform-origin:500px 520px"><rect x="170" y="450" width="660" height="132" rx="24" fill="#132a2e"/><circle class="proof" cx="236" cy="516" r="25"/><circle class="proof" cx="316" cy="516" r="25"/><circle class="proof" cx="396" cy="516" r="25"/><text class="label" x="460" y="508" fill="#fffdf4">precommitted wins</text><text class="body" x="460" y="544" fill="#8fb0b0">over your own baseline</text></g>
  <text class="mono muted" x="335" y="624">only the disagreement survives</text>
</svg>
