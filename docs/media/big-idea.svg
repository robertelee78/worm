<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc" data-archetype="exchange">
  <title id="title">The honest exchange between player and opponent</title>
  <desc id="desc">The player supplies genuine choices. The opponent commits forecasts. An evidence gate compares them with the player's own baseline and returns only an earned read.</desc>
  <style>.bg{fill:#132a2e}.paper{fill:#fffdf4;stroke:#b8ad8e;stroke-width:3}.cyan{fill:#54d3c9}.coral{fill:#ef6a4b}.acid{fill:#d5e83f}.ink{fill:#132a2e}.light{fill:#fffdf4}.muted{fill:#8fb0b0}.label{font:650 30px 'Space Grotesk',sans-serif}.body{font:500 22px 'IBM Plex Sans',sans-serif}.mono{font:600 18px 'IBM Plex Mono',monospace;letter-spacing:.05em}.arrow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.gate{animation:gate 7s infinite}.receipt{animation:receipt 7s infinite}@keyframes gate{0%,40%{transform:translateY(-18px)}55%,100%{transform:none}}@keyframes receipt{0%,52%{opacity:0;transform:translateY(12px)}65%,100%{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.gate,.receipt{animation:none!important}}</style>
  <rect class="bg" width="1000" height="650" rx="28"/>
  <text class="mono muted" x="54" y="60">one player · one persistent opponent · one evidence gate</text>
  <rect class="paper" x="55" y="105" width="270" height="390" rx="24"/><circle class="cyan" cx="190" cy="205" r="55"/><path d="M160 210h60M190 180v60" stroke="#132a2e" stroke-width="12" stroke-linecap="round"/><text class="label ink" x="112" y="305">your choices</text><text class="body ink" x="89" y="348">real forks</text><text class="body ink" x="89" y="382">turn rhythm</text><text class="body ink" x="89" y="416">goal changes</text>
  <rect x="378" y="105" width="244" height="390" rx="24" fill="#244348" stroke="#8fb0b0" stroke-width="3"/><text class="mono muted" x="423" y="145">the audit</text><path class="arrow" d="M418 200h164" stroke="#54d3c9"/><text class="body light" x="410" y="244">forecast committed</text><text class="body light" x="430" y="278">before input</text><path class="arrow" d="M418 324h164" stroke="#d5e83f"/><text class="body light" x="412" y="368">beats your own</text><text class="body light" x="445" y="402">baseline?</text><g class="gate"><rect class="coral" x="463" y="438" width="74" height="22" rx="6"/><path d="M472 443l16 12m15-12l16 12" stroke="#fffdf4" stroke-width="4"/></g>
  <rect class="paper" x="675" y="105" width="270" height="390" rx="24"/><circle class="coral" cx="810" cy="205" r="55"/><path d="M782 232l56-56M798 176h40v40" fill="none" stroke="#132a2e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><text class="label ink" x="731" y="305">its response</text><text class="body ink" x="718" y="348">survival stays fixed</text><text class="body ink" x="718" y="382">intercepts commit</text><text class="body ink" x="718" y="416">only after proof</text>
  <path d="M325 260h53" stroke="#54d3c9" stroke-width="7"/><path d="M622 260h53" stroke="#ef6a4b" stroke-width="7"/><path d="M364 248l14 12-14 12m297-24l14 12-14 12" fill="none" stroke="#fffdf4" stroke-width="6"/>
  <g class="receipt"><rect class="acid" x="294" y="535" width="412" height="72" rx="18"/><text class="label ink" x="353" y="580">earned read → harder commitment</text></g>
</svg>
